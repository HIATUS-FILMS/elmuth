{% extends "base.html" %}

{% block content %}
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
<div class="bg-transparent text-slate-100 min-h-screen flex flex-col font-sans">
    
    <div class="px-6 py-4 flex flex-col items-center bg-transparent">
        <div class="px-6 py-4 flex flex-col items-center">
            <img class="h-10 object-cover ..." src="static/img/logo.png">
        </div>
        <div class="mx-auto flex max-w-sm items-center gap-x-4 rounded-full bg-white p-0 shadow-lg outline outline-black/5 dark:bg-slate-800 dark:shadow-none dark:-outline-offset-1 dark:outline-white/10">
            <ul class="flex">
                <li class="flex-1 mr-2">
                    <a class="text-center block border border-gray-500 rounded-full py-1 px-4 bg-gray-900 hover:bg-transparent text-gray-200" href="#">Broadcast</a>
                </li>
                <li class="flex-1 mr-2">
                    <a class="block py-1 px-4 text-gray-400 cursor-not-allowed" href="#">Playout</a>
                </li>
                <li class="flex-1 mr-2">
                    <a class="block py-1 px-4 text-gray-400 cursor-not-allowed" href="#">Medias</a>
                </li>
                <li class="flex-1 mr-2">
                    <a class="block py-1 px-4 text-gray-400 cursor-not-allowed" href="#">Settings</a>
                </li>
            </ul>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-2 p-4 flex-1">
        <div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl px-3 py-4 flex flex-col items-center">
            <p class="text-slate-300 font-medium">Time</p>
            <div class="bg-black rounded-2xl flex-1 w-full items-center">
                <p id="time" class="text-center text-red-600 font-mono text-[35px]">00:00:00:00</p>
            </div>
        </div>
        <div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl px-3 py-4 flex flex-col items-center">
            <p class="text-slate-300 font-medium">Remaining time</p>
            <div class="bg-black rounded-2xl flex-1 w-full items-center">
                <p class="text-center text-green-600 font-mono text-[35px]">00:00:00:00</p>
            </div>
        </div>
    </div>

    <main class="grid grid-cols-12 gap-4 p-4 flex-1">
        
        <section class="col-span-3 bg-slate-900/50 border border-slate-800/80 rounded-2xl p-4 flex flex-col">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Queue</h2>
            <div id="current-queue" class="space-y-2 overflow-y-auto flex-1 text-xs text-slate-400">

            </div>
        </section>

        <section class="col-span-6 bg-slate-900/50 border border-slate-800/80 rounded-2xl p-4 flex flex-col">
            <div class="flex items-center gap-2">
                <p id="media-title"></p>
                <p id="media-duration"></p>
            </div>
            <div class="bg-black aspect-video rounded-xl border border-slate-800 flex items-center justify-center relative overflow-hidden group">
                
                <video id="videoPlayer" class="h-full w-full rounded-lg" controls autoPlay>
                <source src="http://127.0.0.1:8787/public/1/live/master.m3u8" type="video/m3u8" />
                Your browser does not support the video tag.
                </video>
            </div>

            <div class="mt-4 space-y-2">
                <div class="w-full bg-slate-800 h-1 rounded-full overflow-hidden">
                    <div id="progress" class="bg-emerald-500 w-1/3 h-full"></div>
                </div>
                <div class="flex justify-between text-xs text-slate-500">
                    <span id="media-elapsed">Time elapsed : 00:00</span>
                    <div class="flex gap-3 text-slate-400">
                        <button id="previous-btn" class="hover:text-white">Previous</button>
                        <button id="pause-btn" class="hover:text-white">Pause</button>
                        <button id="next-btn" class="hover:text-white">Next</button>
                    </div>
                    <span id="media-remaining">Remaining time : 00:00</span>
                </div>
            </div>
        </section>

        <section class="col-span-3 bg-slate-900/50 border border-slate-800/80 rounded-2xl p-4 flex flex-col justify-between">
            <div class="space-y-4">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">ffplayout message</h2>

                <div class="space-y-1">
                    <label class="text-[10px] text-slate-400 uppercase tracking-wider">Message text</label>
                    <textarea class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-slate-600" rows="2"></textarea>
                </div>
            </div>
        </section>

    </main>

</div>
{% endblock %}
