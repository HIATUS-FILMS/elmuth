{% for m in medias %}
<label class="p-3 rounded-xl bg-zinc-800/40 border border-zinc-800/50 hover:border-zinc-700 transition flex items-center justify-between gap-4 group cursor-pointer has-[:checked]:bg-mauve-600/50 has-[:checked]:border-mauve-400" data-source="{{ m.filename }}">

    <input type="radio" name="selected" value="mam" class="sr-only"
       hx-get="/playout/inspect?name={{ m.filename | urlencode }}"
       hx-trigger="change"
       hx-target="#insp-title">

    <div class="flex flex-col text-xs text-zinc-400 overflow-hidden">
        <p class="text-zinc-300 font-medium truncate">{{ m.filename }} {% if m.season %}({{ m.season }}){% endif %}</p>
        <span class="text-[10px] text-zinc-500">Type : {{ m.type or 'N/A' }} / Family : {{ m.fam or 'N/A' }} / Length : {{ m.length or '00:00' }}</span>
        <span class="text-[10px] text-zinc-500 truncate">{{ m.description or '...' }}</span>
        <span class="text-[10px] text-zinc-500">First aired : {{ m.first_aired or 'XX/XX/20XX' }} / Last aired : {{ m.last_aired or 'XX/XX/20XX' }}</span>
    </div>

    <div class="flex items-center gap-2 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity duration-200">
        <button class="w-8 h-8 rounded-full bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 text-white flex items-center justify-center transition cursor-pointer"
                hx-post="/playout/playlist_draft_add?source={{ m.filename }}"
                hx-include="#playlist-date"
                hx-target="#playlist-container">
            <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
        </button>

        <button class="w-8 h-8 rounded-full bg-red-950/60 border border-red-900/50 hover:bg-red-900 text-red-400 flex items-center justify-center transition cursor-pointer">
            <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
        </button>
    </div>

</label>
{% else %}
<div class="p-4 text-center text-zinc-600 text-xs">
    Sorry, no media was found.
</div>
{% endfor %}
