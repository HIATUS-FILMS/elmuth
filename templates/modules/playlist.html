<div class="space-y-2 text-xs text-zinc-400 h-full">
    {% for media in playlist %} <!--loop scanning each element in media-->
    <div class="p-2.5 rounded-xl {% if media.is_current %}bg-rose-800/40 border-rose-800/50{% else %}bg-zinc-800/40 border-zinc-700/50{% endif %} border hover:border-zinc-600 cursor-pointer"> <!--putting the current media in rose and animated-->
        <p class="text-zinc-300 font-medium">{{ media.title }}</p> <!--displaying media title-->
        <div class="status-row flex">
            <span class="text-[10px] text-zinc-500">{{ media.formatted_duration }}</span> <!--displaying media duration-->
            {% if media.is_current %}
            <span class="text-[10px] text-rose-500 px-1 font-bold animate-pulse"> · ⯈&#xFE0E; Playing </span> <!--label for the current media playing-->
            {% endif %}
        </div>
    </div>
    {% endfor %}
</div>
