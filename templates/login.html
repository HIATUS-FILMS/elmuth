{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-zinc-950 p-6">
    <div class="bg-zinc-900/50 border border-zinc-800/80 rounded-2xl p-4 flex">
        <form class="w-full max-w-lg py-6" action="/login" method="POST">
        <div class="py-3 flex flex-col items-center">
            <img class="h-18 object-cover" src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo">
        </div>
        <div class="flex flex-wrap -mx-3 mb-6">
            <div class="w-full px-3 py-3">
            <label class="block uppercase tracking-wide text-zinc-100 text-xs font-bold mb-2" for="loginuser">
                username
            </label>
            <input class="py-2.5 w-full bg-zinc-950 border border-zinc-800 rounded-xl p-1 text-xs text-zinc-500 focus:outline-none focus:border-zinc-600 placeholder:text-zinc-500 resize-none shadow-inner" id="loginuser" type="text" placeholder="admin" name="loginuser">
            </div>
            <div class="w-full px-3">
            <label class="block uppercase tracking-wide text-zinc-100 text-xs font-bold mb-2" for="loginpassword">
                password
            </label>
            <input class="py-2.5 w-full bg-zinc-950 border border-zinc-800 rounded-xl p-1 text-xs text-zinc-500 focus:outline-none focus:border-zinc-600 placeholder:text-zinc-500 resize-none shadow-inner" id="loginpassword" type="password" placeholder="**********" name="loginpassword">
        </div>
        </div>
        <div class="mt-6">
            <button type="submit" class="flex bg-transparent border border-zinc-800/80 hover:bg-zinc-700 text-white font-medium py-2 px-4 rounded-full w-full items-center justify-center">
                <svg class="fill-current w-4 h-4 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M0 0h24v24H0z" fill="none" />
                    <path fill="currentColor" d="M13 21q-.425 0-.712-.288T12 20t.288-.712T13 19h6V5h-6q-.425 0-.712-.288T12 4t.288-.712T13 3h6q.825 0 1.413.588T21 5v14q0 .825-.587 1.413T19 21zm-1.825-8H4q-.425 0-.712-.288T3 12t.288-.712T4 11h7.175L9.3 9.125q-.275-.275-.275-.675t.275-.7t.7-.313t.725.288L14.3 11.3q.3.3.3.7t-.3.7l-3.575 3.575q-.3.3-.712.288T9.3 16.25q-.275-.3-.262-.712t.287-.688z" />
                </svg>
                <span>Login</span>
            </button>
        </div>
        </form>
    </div>
</div>
{% endblock %}
