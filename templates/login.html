{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100 p-6">
    <form class="w-full max-w-lg" action="/login" method="POST">
    <img class="h-28 object-contain" src="static/img/logo.png" alt="Elmuth"><br><br>
    <div class="flex flex-wrap -mx-3 mb-6">
        <div class="w-full px-3">
        <label class="block uppercase tracking-wide text-slate-100 text-xs font-bold mb-2" for="loginuser">
            username
        </label>
        <input class="appearance-none block w-full bg-gray-200 text-gray-500 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white" id="loginuser" type="text" placeholder="admin" name="loginuser">
        </div>
        <div class="w-full px-3">
        <label class="block uppercase tracking-wide text-slate-100 text-xs font-bold mb-2" for="loginpassword">
            password
        </label>
        <input class="appearance-none block w-full bg-gray-200 text-gray-500 border border-gray-500 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500" id="loginpassword" type="password" placeholder="**********" name="loginpassword">
        <p class="text-white text-xs italic">Enter your elmuth credentials.</p>
    </div>
    </div>
    <div class="mt-6">
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded focus:outline-none focus:shadow-outline">
        Submit
        </button>
    </div>
    </form>
</div>
{% endblock %}
