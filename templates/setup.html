{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-slate-950 p-6">
    <form class="w-full max-w-lg" action="/setup" method="POST">
    <img class="h-28 object-contain" src="static/img/logo.png" alt="Elmuth"><br><br>
    <div class="flex flex-wrap -mx-3 mb-6">
        <div class="w-full md:w-1/2 px-3 mb-6 md:mb-0">
        <label class="block uppercase tracking-wide text-slate-100 text-xs font-bold mb-2" for="ffuser">
            ffplayout username
        </label>
        <input class="appearance-none block w-full bg-gray-200 text-gray-500 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white" id="ffuser" type="text" placeholder="admin" name="ffuser">
        </div>
        <div class="w-full md:w-1/2 px-3">
        <label class="block uppercase tracking-wide text-slate-100 text-xs font-bold mb-2" for="ffpassword">
            ffplayout password
        </label>
        <input class="appearance-none block w-full bg-gray-200 text-gray-500 border border-gray-500 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500" id="ffpassword" type="password" placeholder="**********" name="ffpassword">
        <p class="text-white text-xs italic">Please fill out this field.</p>
    </div>
    </div>
    <div class="flex flex-wrap -mx-3 mb-6">
        <div class="w-full px-3">
        <label class="block uppercase tracking-wide text-slate-100 text-xs font-bold mb-2" for="ffaddress">
            ffplayout address
        </label>
        <input class="appearance-none block w-full bg-gray-200 text-gray-500 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white focus:border-gray-500" id="ffaddress" type="text" placeholder="http(s)://192.168.1.X:8787" name="ffaddress">
        <p class="text-gray-500 text-xs italic">Specify http(s)://192.168.1.X:8787</p>
        </div>
    </div>
    <div class="flex flex-wrap -mx-3 mb-6">
        <div class="w-full md:w-1/2 px-3 mb-6 md:mb-0">
        <label class="block uppercase tracking-wide text-slate-100 text-xs font-bold mb-2" for="eluser">
            elmuth username
        </label>
        <input class="appearance-none block w-full bg-gray-200 text-gray-500 border border-gray-200 rounded py-3 px-4 mb-3 leading-tight focus:outline-none focus:bg-white" id="eluser" type="text" placeholder="kruger" name="eluser">
        </div>
        <div class="w-full md:w-1/2 px-3">
        <label class="block uppercase tracking-wide text-slate-100 text-xs font-bold mb-2" for="elpassword">
            elmuth password
        </label>
        <input class="appearance-none block w-full bg-gray-200 text-gray-500 border border-gray-500 rounded py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500" id="elpassword" type="password" placeholder="**********" name="elpassword">
        <p class="text-white text-xs italic">Please fill out this field.</p>
    </div>
    </div>
    <div class="mt-6">
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded focus:outline-none focus:shadow-outline">
        Submit
        </button>
    </div>
    </form>
</div>
{% endblock %}
